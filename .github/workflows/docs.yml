name: Documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  readme-links:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test the documentation checker, including broken input
        run: python scripts/test-documentation-checker.py
      - name: Check all documents and localized guide coverage
        run: python scripts/check-documentation.py
      - name: Verify the existing PowerShell entry point
        shell: pwsh
        run: ./scripts/test-readme-links.ps1
