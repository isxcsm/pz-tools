name: Apply reviewed storage performance patch
on:
  push:
    branches: [optimize/repository-housekeeping]
    paths: ['.github/performance-change.*']
permissions:
  contents: read
jobs:
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/optimize/repository-housekeeping'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify exact patch and allowed source paths
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, tempfile, zlib
          parts = sorted(pathlib.Path('.github').glob('performance-change.*'))
          assert len(parts) == 6, 'Incomplete patch'
          payload = ''.join(part.read_text().strip() for part in parts)
          patch = zlib.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'f0393805787eafff49133baddad2e30e712a3ddb22ac8820c9b2219aba1f8924'
          expected = {'src/PzTools.Backup.Engine/ContentComparisonStream.cs', 'src/PzTools.Backup.Engine/DeduplicatingFileCapturer.cs', 'src/PzTools.Backup.Engine/Properties/AssemblyInfo.cs', 'src/PzTools.Backup.Engine/StableFileCapturer.cs', 'src/PzTools.Backup.Storage/Repository/RepositoryDatabase.InitialStaging.cs', 'src/PzTools.Backup.Storage/Repository/RepositoryDatabase.Orphans.cs', 'src/PzTools.Backup.Storage/Repository/RepositoryDatabase.Read.cs', 'src/PzTools.Backup.Storage/Repository/RepositoryDatabase.Revisions.cs', 'src/PzTools.Backup.Storage/Repository/RepositoryDatabase.Summaries.cs', 'src/PzTools.Backup.Storage/Repository/RepositorySchema.cs', 'tests/PzTools.Backup.Tests/StoragePerformanceTests.cs'}
          with tempfile.NamedTemporaryFile() as f:
              f.write(patch); f.flush()
              subprocess.run(['git', 'apply', '--check', f.name], check=True)
              subprocess.run(['git', 'apply', f.name], check=True)
          subprocess.run(['git', 'add', 'src', 'tests'], check=True)
          paths = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0'))
          assert paths == expected, paths
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Commit only to the optimization branch
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Avoid duplicate compression and cache revision summaries transactionally'
          git push origin HEAD:refs/heads/optimize/repository-housekeeping
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run storage regression suites
        shell: pwsh
        run: >-
          dotnet test tests/PzTools.Backup.Tests -c Release -warnaserror
          --filter 'FullyQualifiedName~CompactRepositoryFormatTests|FullyQualifiedName~StableFileCapturerTests|FullyQualifiedName~IncrementalBackupRunnerTests|FullyQualifiedName~InitialBackupRunnerTests|FullyQualifiedName~RepositoryDatabaseTests|FullyQualifiedName~RepositoryMaintenanceTests|FullyQualifiedName~RepositoryHousekeepingTests|FullyQualifiedName~ContentDeduplicationTests|FullyQualifiedName~RevisionRestoreTests|FullyQualifiedName~BackupKindTests|FullyQualifiedName~StreamingFullScannerTests|FullyQualifiedName~StoragePerformanceTests'
          --logger 'trx;LogFileName=storage-performance.trx' --results-directory artifacts/storage-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-performance-tests-${{ needs.apply.outputs.sha }}
          path: artifacts/storage-tests/*.trx
          retention-days: 7
