name: Localization review

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'src/PzTools.App/**'
      - 'src/PzTools.App.Core/**'
      - 'src/PzTools.Process.Contracts/Localization/**'
      - 'tests/PzTools.Backup.Tests/**'
      - 'scripts/check-localization.py'
      - '.github/workflows/i18n-review.yml'

permissions:
  contents: read

concurrency:
  group: localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check all locale resources and shared game notices
        run: python scripts/check-localization.py

  messages:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
      - name: Run localization and user-message regressions
        run: >-
          dotnet test tests/PzTools.Backup.Tests -c Release
          --filter 'FullyQualifiedName~LocalizationTests|FullyQualifiedName~UserFacingMessageTests|FullyQualifiedName~SaveActionTooltipTests|FullyQualifiedName~OperationProgressDisplayTests'
          --logger 'trx;LogFileName=localization.trx' --results-directory artifacts/localization
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-tests-${{ github.sha }}
          path: artifacts/localization/*.trx
          if-no-files-found: warn
          retention-days: 14
