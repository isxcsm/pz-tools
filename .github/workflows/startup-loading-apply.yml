name: Validate initial save-list loading
on:
  push:
    branches: [optimize/gameplay-background-load]
    paths: ['.github/workflows/startup-loading-apply.yml', '.github/startup-loading.patch.b64']
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/optimize/gameplay-background-load'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.patch.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply reviewed startup-only change to the pinned branch
        id: patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess, tempfile
          def run(*args): subprocess.run(args, check=True)
          def output(*args): return subprocess.check_output(args).decode().strip()
          run('git', 'diff', '--exit-code', 'cbb00dcc0b913d7c3d15a6813cec9b6136b98bba', '--', 'src', 'tests')
          patch = lzma.decompress(base64.b64decode(pathlib.Path('.github/startup-loading.patch.b64').read_text(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0cd6a1bdc9509623f53e90280f4f0816fb237d5f6b0b5b6a9b65c4e597e6bded'
          with tempfile.NamedTemporaryFile() as f:
              f.write(patch); f.flush()
              run('git', 'apply', '--check', '--index', f.name)
              run('git', 'apply', '--index', f.name)
          expected = {'src/PzTools.App.Core/SaveListPresentation.cs','src/PzTools.App/MainWindowShell.xaml','src/PzTools.App/MainWindowShell.xaml.cs','src/PzTools.Projections/AuthorityProjectors.cs','src/PzTools.Projections/ViewComparers.cs','src/PzTools.Projections/ViewModels.cs','src/PzTools.Zomboid.State/StateDatabase.cs','src/PzTools.Zomboid.State/StateModels.cs','tests/PzTools.Backup.Tests/SaveListStartupLoadingTests.cs'}
          assert set(output('git','diff','--cached','--name-only').splitlines()) == expected
          run('git','diff','--cached','--check')
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','commit','-m','Keep initial save-list progress visible until discovery is applied')
          run('git','push','origin','HEAD:refs/heads/optimize/gameplay-background-load')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('commit='+output('git','rev-parse','HEAD')+'\n')
          PY
  startup-tests:
    needs: apply
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check startup, actual discovery, projection and failure recovery
        shell: pwsh
        run: >-
          dotnet test tests/PzTools.Backup.Tests -c Release -warnaserror
          --filter 'FullyQualifiedName~SaveListStartupLoadingTests|FullyQualifiedName~StateStartupTests|FullyQualifiedName~ProjectionRuntimeTests|FullyQualifiedName~GameplayBackgroundTests|FullyQualifiedName~CharacterProjectionTimingTests|FullyQualifiedName~AutomaticBackupRegressionTests|FullyQualifiedName~SchedulerCountdown'
          --logger 'trx;LogFileName=startup-loading.trx' --results-directory artifacts/startup-loading
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-loading-${{ needs.apply.outputs.commit }}
          path: artifacts/startup-loading/*.trx
          retention-days: 14
