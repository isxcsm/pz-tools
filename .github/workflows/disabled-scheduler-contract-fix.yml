name: Update disabled scheduling contract assertion
on:
  push:
    branches: [optimize/storage-hotpaths]
    paths: ['.github/workflows/disabled-scheduler-contract-fix.yml']
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Align the regression with the reviewed source bytes
        run: |
          python - <<'PY'
          import pathlib, subprocess, hashlib
          def run(*args): subprocess.run(args, check=True)
          path = 'tests/PzTools.Backup.Tests/SchedulerTests.cs'
          assert subprocess.check_output(['git','hash-object',path]).decode().strip() == 'e4606813771555c24ffe091be9aa01eb392ee477'
          p=pathlib.Path(path)
          lines=p.read_text(encoding='utf-8').splitlines()
          start=lines.index('// Activity and the automation switch are separate: re-enabling should not')
          end=lines.index('    PzTools.Projections.ViewKey.ScheduleStatus, 0).Snapshot!.NextDueUtc);',start)
          for i in range(start,end+1): lines[i]=' '*8+lines[i]
          content=('\n'.join(lines)+'\n').encode('utf-8')
          assert hashlib.sha256(content).hexdigest() == 'bd9c00fca3f3fad80404ff833b1d4d50c5e7dac371684430b74460e1e62e7852'
          p.write_bytes(content)
          run('git','diff','--check')
          run('git','add',path)
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','commit','-m','Keep scheduling regression formatting consistent with reviewed code')
          run('git','push','origin','HEAD:refs/heads/optimize/storage-hotpaths')
          PY
