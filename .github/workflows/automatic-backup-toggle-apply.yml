name: Apply independent automatic backup settings
on:
  push:
    branches: [optimize/gameplay-background-load]
    paths: ['.github/workflows/automatic-backup-toggle-apply.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/optimize/gameplay-background-load'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply only reviewed settings and translation edits
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python .github/apply-automatic-backup-toggle.py
          python scripts/check-localization.py
          python scripts/check-documentation.py
          python scripts/test-documentation-checker.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git ls-remote origin refs/heads/optimize/gameplay-background-load | cut -f1)" = "$GITHUB_SHA"
          git commit -m 'Separate automatic backup enablement from its retained 1-60 minute interval'
          git push origin HEAD:refs/heads/optimize/gameplay-background-load
