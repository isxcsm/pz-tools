name: Storage performance regression
on:
  pull_request:
    branches: [dev, main]
    paths: ['src/**', 'tests/**', 'scripts/**', '.github/workflows/storage-performance.yml']
permissions:
  contents: read
concurrency:
  group: storage-performance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  storage-tests:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check housekeeping SQL and record catalog query evidence
        shell: pwsh
        run: |
          python scripts/check-housekeeping-sql.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item artifacts/storage-tests -ItemType Directory -Force | Out-Null
          python scripts/measure-catalog-performance.py --baseline-ref 2f3ce6f > artifacts/storage-tests/catalog-query.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run storage, capture, deduplication and catalog regressions
        shell: pwsh
        run: >-
          dotnet test tests/PzTools.Backup.Tests -c Release -warnaserror
          --filter 'FullyQualifiedName~CompactRepositoryFormatTests|FullyQualifiedName~StableFileCapturerTests|FullyQualifiedName~IncrementalBackupRunnerTests|FullyQualifiedName~InitialBackupRunnerTests|FullyQualifiedName~RepositoryDatabaseTests|FullyQualifiedName~RepositoryMaintenanceTests|FullyQualifiedName~RepositoryHousekeepingTests|FullyQualifiedName~ContentDeduplicationTests|FullyQualifiedName~RevisionRestoreTests|FullyQualifiedName~BackupKindTests|FullyQualifiedName~StreamingFullScannerTests|FullyQualifiedName~StoragePerformanceTests'
          --logger 'trx;LogFileName=storage-performance.trx' --results-directory artifacts/storage-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-tests-${{ github.sha }}
          path: artifacts/storage-tests/*
          retention-days: 7
