name: Gameplay optimization source snapshot
on:
  push:
    branches: [optimize/gameplay-background-load]
    paths: ['.github/workflows/gameplay-review-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package exact development snapshot
        run: |
          git branch review-base 51c8db80f1957cb5b6d5987570ffeb46b4ddf6b3
          git bundle create gameplay-source.bundle review-base
      - uses: actions/upload-artifact@v4
        with:
          name: gameplay-source-51c8db8
          path: gameplay-source.bundle
          retention-days: 1
