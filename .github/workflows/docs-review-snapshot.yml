name: Verify reviewed documentation
on:
  push:
    branches: [docs/plain-language-guides]
    paths: ['.github/workflows/docs-review-snapshot.yml', '.docs-review-transfer/**']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply exact reviewed documentation
        run: python .docs-review-transfer/apply.py
      - name: Test checker failure cases
        run: python scripts/test-documentation-checker.py
      - name: Check all guide topics and documentation links
        run: python scripts/check-documentation.py
      - name: Check the original PowerShell entry point
        shell: pwsh
        run: ./scripts/test-readme-links.ps1
      - name: Record content identity
        shell: pwsh
        run: |
          New-Item artifacts/docs-review -ItemType Directory -Force | Out-Null
          git diff -- README.md docs scripts > artifacts/docs-review/verified.patch
          git rev-parse HEAD > artifacts/docs-review/base.txt
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-review-${{ matrix.os }}
          path: artifacts/docs-review
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python .docs-review-transfer/apply.py
      - name: Commit only reviewed docs to the expected branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/docs/plain-language-guides'
          actual=$(git ls-remote origin refs/heads/docs/plain-language-guides | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git diff --check
          git add -- README.md docs scripts
          test "$(git diff --cached --name-only | wc -l)" -eq 50
          git config user.name 'Documentation review'
          git config user.email 'isxcsm@users.noreply.github.com'
          git commit -m 'docs: replace slogans and align user guides across 18 languages'
          git push origin HEAD:refs/heads/docs/plain-language-guides
          mkdir -p artifacts/docs-publish
          git rev-parse HEAD > artifacts/docs-publish/commit.txt
          git diff --name-only HEAD^ HEAD > artifacts/docs-publish/files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-review-published
          path: artifacts/docs-publish
          retention-days: 7
