name: Apply reviewed connection initialization
on:
  push:
    branches: [optimize/repository-housekeeping]
    paths: ['.github/repository-connection.patch']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Apply exact reviewed source patch
        run: |
          echo '784b3f0528d4fdfb517b29d6c047a64cc4d9d7bdd9c7b0164dc9464509c02e94  .github/repository-connection.patch' | sha256sum --check
          git apply --check .github/repository-connection.patch
          git apply .github/repository-connection.patch
          git diff --check
      - id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/PzTools.Backup.Storage/Repository/RepositoryDatabase.cs
          git rm .github/repository-connection.patch .github/workflows/apply-connection-initialization.yml
          git commit -m 'Initialize WAL connections before transactions and tolerate bounded mapped-file contention'
          git push origin HEAD:refs/heads/optimize/repository-housekeeping
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
      - name: Verify ownership, initialization and repeated crash recovery
        run: dotnet test tests/PzTools.Backup.Tests -c Release -warnaserror --filter 'FullyQualifiedName~ConnectionOwnershipTests|FullyQualifiedName~RepositoryConnectionInitializationTests|FullyQualifiedName~CrashRecoveryStressTests|FullyQualifiedName~InterruptedOperationRecoveryTests' --logger 'trx;LogFileName=connection.trx' --results-directory artifacts/final-review
      - name: Build Windows solution
        run: dotnet build PzTools.sln -c Release -p:Platform=x64 -warnaserror
      - name: Full regression suite
        run: dotnet test tests/PzTools.Backup.Tests -c Release --logger 'trx;LogFileName=full.trx' --results-directory artifacts/final-review
      - name: Publish matching distribution
        run: ./scripts/publish-app.ps1 -Configuration Release -JdkPath $env:JAVA_HOME -Output artifacts/review-app
      - name: Test actual published payload
        run: |
          $env:PZTOOLS_DISTRIBUTION_DIR = (Resolve-Path artifacts/review-app).Path
          $env:PZTOOLS_TOOLS_DIR = $env:PZTOOLS_DISTRIBUTION_DIR
          dotnet test tests/PzTools.Backup.Tests -c Release --logger 'trx;LogFileName=distribution.trx' --results-directory artifacts/final-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connection-review-${{ needs.apply.outputs.sha }}
          path: artifacts/final-review/*.trx
          retention-days: 7
