name: Finish lifecycle test review
on:
  push:
    branches: [optimize/repository-housekeeping]
    paths: ['.github/workflows/finish-lifecycle-review.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Synchronize lifecycle tests on observable state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/PzTools.Backup.Tests/ProjectionRuntimeTests.cs')
          text = p.read_text()
          old = '''        host.Start();
                  await Task.Delay(80);

                  Assert.True(healthyRuns > 1);
                  Assert.Contains(host.Statuses, item =>
                      item.Name == "healthy" && item.Health == ProjectorHealth.Healthy);
                  Assert.Contains(host.Statuses, item =>
                      item.Name == "faulted" && item.Health == ProjectorHealth.Faulted);'''
          new = '''        host.Start();
                  // Observe completed work, not an assumed number of ticks in 80 ms.
                  // The timeout bounds a real failure; it is not a performance threshold.
                  using var deadline = new CancellationTokenSource(TimeSpan.FromSeconds(10));
                  while (Volatile.Read(ref healthyRuns) <= 1
                      || !host.Statuses.Any(item => item.Name == "healthy" && item.Health == ProjectorHealth.Healthy)
                      || !host.Statuses.Any(item => item.Name == "faulted" && item.Health == ProjectorHealth.Faulted))
                      await Task.Delay(10, deadline.Token);

                  Assert.True(Volatile.Read(ref healthyRuns) > 1);
                  Assert.Contains(host.Statuses, item =>
                      item.Name == "healthy" && item.Health == ProjectorHealth.Healthy);
                  Assert.Contains(host.Statuses, item =>
                      item.Name == "faulted" && item.Health == ProjectorHealth.Faulted);
                  host.RequestStop();
                  while (host.Statuses.Any(item => item.Health != ProjectorHealth.Stopped))
                      await Task.Delay(10, deadline.Token);
                  Assert.All(host.Statuses, item => Assert.Equal(ProjectorHealth.Stopped, item.Health));'''
          assert text.count(old) == 1, 'projection test changed'
          p.write_text(text.replace(old, new))
          p = Path('tests/PzTools.Backup.Tests/ApplicationInstanceLeaseTests.cs')
          text = p.read_text()
          old = '''            using var reopened = ApplicationInstanceLease.TryAcquire(temp.Path);
                      Assert.NotNull(reopened);'''
          new = '''            // Process exit and observable named-marker release are separate
                      // conditions. Keep the real duplicate rejection check above and
                      // require reacquisition within a bounded deadline, without GC.
                      using var reopened = await WaitForReleasedMarkerAsync(temp.Path);
                      Assert.NotNull(reopened);
                      using var duplicateAfterRestart = ApplicationInstanceLease.TryAcquire(temp.Path);
                      Assert.Null(duplicateAfterRestart);'''
          assert text.count(old) == 1, 'instance test changed'
          text = text.replace(old, new)
          marker = '    private static System.Diagnostics.Process StartFixture(string root)'
          helper = '''    private static async Task<ApplicationInstanceLease> WaitForReleasedMarkerAsync(string root)
              {
                  using var deadline = new CancellationTokenSource(TimeSpan.FromSeconds(10));
                  while (true)
                  {
                      deadline.Token.ThrowIfCancellationRequested();
                      var lease = ApplicationInstanceLease.TryAcquire(root);
                      if (lease is not null) return lease;
                      await Task.Delay(10, deadline.Token);
                  }
              }

          '''
          assert text.count(marker) == 1
          p.write_text(text.replace(marker, helper + marker))
          PY
          git diff --check
          git diff --stat
      - name: Commit reviewed tests and remove one-shot helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/PzTools.Backup.Tests/ProjectionRuntimeTests.cs tests/PzTools.Backup.Tests/ApplicationInstanceLeaseTests.cs
          git rm .github/workflows/finish-lifecycle-review.yml
          git commit -m 'Wait for observable lifecycle transitions instead of fixed scheduling delays'
          git push origin HEAD:refs/heads/optimize/repository-housekeeping
