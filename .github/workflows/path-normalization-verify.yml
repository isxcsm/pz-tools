name: Validate normalized path storage
on:
  push:
    branches: [optimize/content-fingerprint128]
    paths: ['.github/workflows/path-normalization-verify.yml', '.github/path-normalization.part*']
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/optimize/content-fingerprint128'
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Apply exact reviewed patch to unchanged product sources
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess, tempfile
          subprocess.run(['git','diff','--exit-code','9894bddbab50d5be6d75f5f37482f85e5a10bd7d','--','src','tests','scripts','docs','.github/workflows/storage-performance.yml'], check=True)
          parts = [pathlib.Path(f'.github/path-normalization.part{i}') for i in range(1,4)]
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e88b5bc1db0b7fa24a6ac34bafa38496825dd199f576f6ff1d54eae716cb9450'
          with tempfile.NamedTemporaryFile(delete=False) as f:
              f.write(patch)
              name = f.name
          try:
              subprocess.run(['git','apply','--check',name], check=True)
              subprocess.run(['git','apply',name], check=True)
          finally:
              pathlib.Path(name).unlink()
          subprocess.run(['git','add','src','tests','scripts','docs','.github/workflows/storage-performance.yml'], check=True)
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0')
          assert len(paths) == 26 and all(p.startswith(('src/','tests/','scripts/','docs/')) or p == '.github/workflows/storage-performance.yml' for p in paths), paths
          subprocess.run(['git','diff','--cached','--check'], check=True)
          PY
      - name: Check production SQL and metadata layout
        shell: pwsh
        run: |
          python scripts/check-path-normalization.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-housekeeping-sql.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item artifacts/path-validation -ItemType Directory -Force | Out-Null
          python scripts/measure-path-normalization.py > artifacts/path-validation/layout.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/measure-catalog-performance.py --files 1000 --revisions 10 --changes 100 > artifacts/path-validation/catalog.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run normalized path and adjacent storage regressions
        shell: pwsh
        run: >-
          dotnet test tests/PzTools.Backup.Tests -c Release -warnaserror
          --filter 'FullyQualifiedName~NormalizedPathTests|FullyQualifiedName~ContentFingerprintTests|FullyQualifiedName~CompactRepositoryFormatTests|FullyQualifiedName~StableFileCapturerTests|FullyQualifiedName~IncrementalBackupRunnerTests|FullyQualifiedName~InitialBackupRunnerTests|FullyQualifiedName~RepositoryDatabaseTests|FullyQualifiedName~RepositoryMaintenanceTests|FullyQualifiedName~RepositoryHousekeepingTests|FullyQualifiedName~ContentDeduplicationTests|FullyQualifiedName~RevisionRestoreTests|FullyQualifiedName~BackupKindTests|FullyQualifiedName~StreamingFullScannerTests|FullyQualifiedName~StoragePerformanceTests|FullyQualifiedName~MissingIdentityDeletionTests'
          --logger 'trx;LogFileName=paths.trx' --results-directory artifacts/path-validation
      - name: Commit only validated product, tests and documentation
        shell: bash
        run: |
          # Workflow writes/cleanup are performed separately through the authorized connector.
          # GITHUB_TOKEN only publishes the validated product changes, without escalation.
          git restore --staged --worktree .github/workflows/storage-performance.yml
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0')
          assert len(paths) == 25 and all(p.startswith(('src/','tests/','scripts/','docs/')) for p in paths), paths
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize path IDs and preserve immutable historical spellings (schema 3)'
          git rev-parse HEAD > artifacts/path-validation/commit.txt
          git push origin HEAD:refs/heads/optimize/content-fingerprint128
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normalized-path-validation-${{ github.sha }}
          path: artifacts/path-validation/*
          retention-days: 14
