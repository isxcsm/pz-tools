name: Storage hotpath source snapshot
on:
  push:
    branches: [optimize/storage-hotpaths]
    paths: ['.github/workflows/hotpath-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 52e8822a3192acaf7cb95d68e6a0657ecab0bbc3
          persist-credentials: false
      - run: git archive --format=zip -o source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: storage-hotpath-source-52e8822
          path: source.zip
          retention-days: 1
