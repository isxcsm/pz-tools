name: Apply and verify gameplay background optimization
on:
  push:
    branches: [optimize/gameplay-background-load]
    paths: ['.github/workflows/gameplay-apply.yml', '.github/gameplay.part*']
permissions:
  contents: read
jobs:
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/optimize/gameplay-background-load'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      implementation: ${{ steps.apply.outputs.implementation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: apply
        name: Apply pinned checksum-verified product patch
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess,tempfile,os
          def run(*a): subprocess.run(a,check=True)
          def out(*a): return subprocess.check_output(a).decode().strip()
          run('git','diff','--exit-code','51c8db80f1957cb5b6d5987570ffeb46b4ddf6b3','--','src','tests','docs','config')
          text=''.join(pathlib.Path(f'.github/gameplay.part{i}').read_text().strip() for i in [1,2])
          patch=lzma.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='066b22cc6479588bb6efe8235b0085d88eb7aef2b0ae78e141bffa3be6e6f73b'
          with tempfile.NamedTemporaryFile(delete=False) as f:
              f.write(patch)
              name=f.name
          try:
              run('git','apply','--check',name)
              run('git','apply',name)
          finally: pathlib.Path(name).unlink()
          run('git','add','src','tests','docs','config')
          paths=out('git','diff','--cached','--name-only').splitlines()
          assert paths and all(p.startswith(('src/','tests/','docs/','config/')) for p in paths),paths
          run('git','diff','--cached','--check')
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','commit','-m','Reuse JVM bootstrap and hook; defer gameplay maintenance and preserve mandatory save(true)')
          run('git','push','origin','HEAD:refs/heads/optimize/gameplay-background-load')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('implementation='+out('git','rev-parse','HEAD')+'\n')
          PY
  regressions:
    needs: apply
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.implementation }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify state, projection, save boundary and maintenance regressions
        shell: pwsh
        run: >-
          dotnet test tests/PzTools.Backup.Tests -c Release -warnaserror
          --filter 'FullyQualifiedName~GameplayBackgroundTests|FullyQualifiedName~AutomaticBackupRegressionTests|FullyQualifiedName~OptimizationFollowupTests|FullyQualifiedName~SchedulerTests|FullyQualifiedName~StatePipelineTests|FullyQualifiedName~ProjectionTests|FullyQualifiedName~BackupGameSave|FullyQualifiedName~Telemetry|FullyQualifiedName~OrphanBackup|FullyQualifiedName~Maintenance'
          --logger 'trx;LogFileName=gameplay-regressions.trx' --results-directory artifacts/gameplay-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-regressions-${{ needs.apply.outputs.implementation }}
          path: artifacts/gameplay-tests/*.trx
          retention-days: 14
  bridge:
    needs: apply
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.implementation }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
      - name: Exercise repeated JVM sessions, authentication, mandatory saving and restoration
        shell: pwsh
        run: ./scripts/test-save-bridge.ps1 -JdkPath $env:JAVA_HOME
