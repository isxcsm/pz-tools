name: Review fixes and full verification
on:
  push:
    branches: [optimize/repository-housekeeping]
    paths: ['.github/workflows/merge-review-fixes.yml']
permissions:
  contents: read
jobs:
  fix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/optimize/repository-housekeeping'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Apply bounded connection-ownership fixes and crash diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              ('src/PzTools.Scheduling/SchedulerDatabase.cs', 'token'),
              ('src/PzTools.Zomboid.State/StateDatabase.cs', 'cancellationToken'),
              ('src/PzTools.Process.Telemetry/ProcessTelemetryStore.cs', 'token'),
          ]
          for filename, token in targets:
              p = Path(filename)
              text = p.read_text(encoding='utf-8-sig')
              marker = f'async Task<SqliteConnection> OpenAsync(CancellationToken {token})'
              assert text.count(marker) == 1, filename
              start = text.index(marker)
              start = text.rfind('\n', 0, start) + 1
              body_start = text.index('    {\n', start)
              end = text.index('\n    }', body_start) + len('\n    }')
              old = text[start:end]
              body = text[body_start + len('    {\n'):end - len('\n    }')]
              allocation = '        var connection = new SqliteConnection(connectionString);\n'
              assert body.startswith(allocation), filename
              body = body[len(allocation):]
              visibility = 'internal' if old.lstrip().startswith('internal') else 'private'
              replacement = f'''    {visibility} Task<SqliteConnection> OpenAsync(CancellationToken {token}) =>
                  OpenConfiguredAsync(new SqliteConnection(connectionString), {token});

              // Own the native handle until every configuration statement succeeds.
              // The caller cannot dispose a connection that was never returned.
              private static async Task<SqliteConnection> OpenConfiguredAsync(
                  SqliteConnection connection, CancellationToken {token})
              {{
                  try
                  {{
          '''
              # Keep C# indentation independent of this workflow's YAML indentation.
              replacement = replacement.replace('\n              ', '\n    ').replace('\n                  ', '\n        ')
              replacement += '\n'.join('    ' + line for line in body.splitlines())
              replacement += '\n        }\n        catch\n        {\n            await connection.DisposeAsync();\n            throw;\n        }\n    }'
              p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          p = Path('tests/PzTools.Backup.Tests/InterruptedOperationRecoveryTests.cs')
          text = p.read_text()
          marker = '        var repository = await RepositoryDatabase.CreateOrOpenAsync(Path.Combine(root, "repository"));'
          assert text.count(marker) == 1
          text = text.replace(marker, '        try\n        {\n' + marker)
          marker = '        Assert.Equal(0, repeated.RecoveredWorkflows + repeated.RecoveredSaves + repeated.DeletedArtifacts);'
          assert text.count(marker) == 1
          text = text.replace(marker, marker + '''
                  }
                  catch (SqliteException exception)
                  {
                      throw new Xunit.Sdk.XunitException($"Crash recovery mode={mode}; SQLite primary={exception.SqliteErrorCode}; extended={exception.SqliteExtendedErrorCode}; native={SQLitePCL.raw.sqlite3_libversion().utf8_to_string()}; {exception}");
                  }''')
          p.write_text(text)
          PY
          git diff --check
      - name: Commit only to reviewed branch and remove one-shot workflow
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/PzTools.Scheduling/SchedulerDatabase.cs src/PzTools.Zomboid.State/StateDatabase.cs src/PzTools.Process.Telemetry/ProcessTelemetryStore.cs tests/PzTools.Backup.Tests/InterruptedOperationRecoveryTests.cs
          git rm .github/workflows/merge-review-fixes.yml
          git commit -m 'Close failed SQLite connection setup paths and expose crash recovery error codes'
          git push origin HEAD:refs/heads/optimize/repository-housekeeping
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip --output=reviewed-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: merge-reviewed-source-${{ steps.commit.outputs.sha }}
          path: reviewed-source.zip
          retention-days: 1
  verify:
    needs: fix
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.fix.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
      - name: Verify connection ownership and crash boundaries
        run: dotnet test tests/PzTools.Backup.Tests -c Release --filter 'FullyQualifiedName~ConnectionOwnershipTests|FullyQualifiedName~InterruptedOperationRecoveryTests' --logger 'trx;LogFileName=review-fixes.trx' --results-directory artifacts/review-results
      - name: Build complete Windows application
        run: dotnet build PzTools.sln -c Release -p:Platform=x64 -warnaserror
      - name: Run full tests
        run: dotnet test tests/PzTools.Backup.Tests -c Release --no-build --logger 'trx;LogFileName=full.trx' --results-directory artifacts/review-results
      - name: Publish matching app and workers
        run: ./scripts/publish-app.ps1 -Configuration Release -JdkPath $env:JAVA_HOME -Output artifacts/review-app
      - name: Verify actual published payload
        run: |
          $env:PZTOOLS_DISTRIBUTION_DIR = (Resolve-Path artifacts/review-app).Path
          $env:PZTOOLS_TOOLS_DIR = $env:PZTOOLS_DISTRIBUTION_DIR
          dotnet test tests/PzTools.Backup.Tests -c Release --logger 'trx;LogFileName=distribution.trx' --results-directory artifacts/review-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merge-review-tests-${{ needs.fix.outputs.sha }}
          path: artifacts/review-results/*.trx
          retention-days: 7
