<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #15171a; --panel: #1e2125; --line: #33373d; --text: #d9dde2; --dim: #8a9099; --accent: #e0a050; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 "Noto Sans KR", "Malgun Gothic", sans-serif; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding: 12px; height: 100vh; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; height: auto; } }
  .stage { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  canvas#view { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); border-radius: 6px; display: block; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar input[type=range] { flex: 1; min-width: 160px; }
  button { background: #2a2e34; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #4a3520; border-color: #8a5a2a; }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-y: auto; }
  h2 { font-size: 12px; margin: 14px 0 6px; color: var(--accent); font-weight: 700; letter-spacing: 0.02em; }
  h2:first-child { margin-top: 0; }
  label.row { display: grid; grid-template-columns: 112px 1fr 52px; gap: 6px; align-items: center; margin: 3px 0; }
  label.row span.v { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
  input[type=text], select { width: 100%; background: #121417; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
  .hint { color: var(--dim); font-size: 12px; }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 120px; }
  textarea { width: 100%; height: 120px; background: #121417; color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: 11px/1.4 Consolas, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="view" width="1280" height="720"></canvas>
    <div class="bar">
      <button class="primary" id="play">처음부터 재생</button>
      <button id="leaveNow">바로 사라지기</button>
      <button id="pause">일시정지</button>
      <label class="hint">속도 <select id="speed"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label>
      <span class="time" id="time"></span>
    </div>
    <div class="bar"><input type="range" id="scrub" min="0" max="1000" value="0"><span class="hint">타임라인 직접 조절</span></div>
    <div class="hint">PZ Extension API의 타이틀 스타일(Texts.java)과 dust(Dust.java)를 같은 수식, 같은 합성(premultiplied)으로 그립니다. 글꼴 모양, 그림자, 외곽선만 근사치입니다. "새안"은 아직 게임에 없는 시안입니다.</div>
  </div>
  <div class="side" id="side"></div>
</div>
<script>
"use strict";
// ---------------------------------------------------------------- parameters (Dust.java's constants, editable)
const P = {
  // text
  title: "2차 강화판 열림", sub: "세 트리의 마지막 강화를 모두 시험해",
  style: "dust-paper", tone: "style", sweep: "downleft", dustSize: 1, dustDrift: 1, leaveTime: 10, hold: 5, seed: 12345,
  burnOn: true, burnR: 1.0, burnG: 0.32, burnB: 0.10, backdrop: true, bg: "night",
  // schedule
  SWEEP: 0.35, JITTER: 0.25, WEATHER: 0.12, WEATHERED: 0.4, THIN: 0.22, HOLD: 0.25,
  // burn
  GLOW: 0.45, COOL: 0.4, BURN_ASH: 0.3, SCORCH_END: 0.4, GLOW_PEAK: 0.62, GLOW_END: 0.85, SPARKS: 0.25, CHAR_ASH: 0.45,
  SCORCH_R: 0.34, SCORCH_G: 0.18, SCORCH_B: 0.1, CHAR_R: 0.07, CHAR_G: 0.055, CHAR_B: 0.05, FLICKER: 9, FLICKER_DEPTH: 0.3,
  // paper (a new way: the text burns spot by spot, its ash shards tumbling)
  IMPACT_COOL: 4, IMPACT_GLOW: 1, IMPACT_STREAK: 0.8, IMPACT_DUST: 1, SHINE_AT: 0.8, SHINE: 0.45, ERODE_GRAIN: 9, ERODE_DRAIN: 0.8, TRACK: 0.07, TRACK_BLUR: 0.6, TRACK_RISE: 0.05, TRACK_STAGGER: 0.12,
  zoom: 2, FRONT: 0.52, SPREAD: 0.07, EDGE_W: 0.012, CHAR_W: 0.02, SCORCH_W: 0.07, RAGGED: 0.03, CURL: 0.6,
  FLAKES: 0.5, FLAKE_SIZE: 1.1, SPIN: 7, GREYING: 0.35, PAPER_ASH: 0.55,
};
const CUTS = new Set(["style", "hold", "title", "sub", "tone", "sweep", "dustSize", "seed", "SWEEP", "JITTER", "RAGGED", "CURL", "FRONT", "SPREAD"]);
const TONES = {
  dust: [[0.97, 0.95, 0.9], [0.86, 0.85, 0.82]],
  gold: [[1.00, 0.86, 0.50], [0.95, 0.88, 0.70]],
  green: [[0.62, 1.00, 0.70], [0.78, 0.95, 0.82]],
  red: [[1.00, 0.55, 0.50], [0.95, 0.75, 0.72]],
};
// fixed ones
const RISE = 2.0, SIDE = 4.5, SWIRL_X = 0.15, SWIRL_Y = 0.3, CATCH = 0.12, SAG = 0.08, CELL = 0.04, MIN_CELL = 1.5,
  MAX_CELLS = 4500, INK = 10, MARGIN = 0.2, PATCH = 6, FINE_PATCH = 2.5, EMBER_G = 0.84, EMBER_B = 0.62, ASH = 0.5;
// The API's title styles (Texts.java Styles), and new ones tried here. Sizes are shares of the screen's height, the gap
// in the title's lines, times in seconds; the line leaves trail seconds after the title.
const STYLES = {
  "stamp": { label: "stamp (게임 현재)", y: 0.28, gap: 0.25, trail: 0, backdrop: 0.3,
    title: { weight: 700, size: 0.1, color: [1, 1, 1], outline: 0.45, enter: "slam", enterTime: 0.22, leave: "grow", leaveTime: 0.7 },
    line: { weight: 400, size: 0.045, color: [0.88, 0.88, 0.88], delay: 0.2, enter: "fade", enterTime: 0.35, leave: "fade", leaveTime: 0.7 } },
  "stamp-new": { label: "stamp 새안: 각인", y: 0.28, gap: 0.25, trail: 0.4, backdrop: 0.3,
    title: { weight: 700, size: 0.1, color: [0.9, 0.89, 0.86], outline: 0.45, enter: "impact", enterTime: 0.6, leave: "erode", leaveTime: 6 },
    line: { weight: 400, size: 0.045, color: [0.9, 0.9, 0.88], delay: 0.45, enter: "slideup", enterTime: 0.5, leave: "erode", leaveTime: 5.6 } },
  "discovery": { label: "discovery (게임 현재)", y: 0.28, gap: 0.3, trail: 0, backdrop: 0.3,
    title: { weight: 700, italic: true, size: 0.08, color: [1, 0.8, 0.38], enter: "rise", enterTime: 0.6, leave: "rise", leaveTime: 0.9 },
    line: { weight: 400, size: 0.042, color: [1, 0.93, 0.78], delay: 0.25, enter: "rise", enterTime: 0.6, leave: "rise", leaveTime: 0.9 } },
  "notice": { label: "notice (게임 현재)", y: 0.2, gap: 0.3, trail: 0, backdrop: 0.3,
    title: { weight: 700, size: 0.036, color: [0.92, 0.95, 1], enter: "drop", enterTime: 0.35, leave: "fade", leaveTime: 0.6 },
    line: { weight: 400, size: 0.026, color: [0.8, 0.84, 0.9], delay: 0.1, enter: "fade", enterTime: 0.35, leave: "fade", leaveTime: 0.6 } },
  "unveil": { label: "unveil (게임 현재)", y: 0.28, gap: 0.35, trail: 0, backdrop: 0.3,
    title: { weight: 400, size: 0.075, color: [0.96, 0.93, 0.86], outline: 0.35, enter: "settle", enterTime: 1.4, leave: "fade", leaveTime: 1.0 },
    line: { weight: 400, size: 0.036, color: [0.84, 0.83, 0.8], delay: 0.6, enter: "fade", enterTime: 1.0, leave: "fade", leaveTime: 1.0 } },
  "dust": { label: "dust (게임 현재: 숯불 셀)", y: 0.28, gap: 0.3, trail: 0.3, backdrop: 0.3,
    title: { weight: 400, size: 0.085, color: [0.97, 0.95, 0.9], outline: 0.35, enter: "fade", enterTime: 1.2, leave: "dust" },
    line: { weight: 400, size: 0.04, color: [0.86, 0.85, 0.82], delay: 0.35, enter: "fade", enterTime: 1.2, leave: "dust" } },
  "dust-paper": { label: "dust 새안: 종이 연소 1", y: 0.28, gap: 0.3, trail: 0.3, backdrop: 0.3,
    title: { weight: 400, size: 0.085, color: [0.97, 0.95, 0.9], outline: 0.35, enter: "fade", enterTime: 1.2, leave: "paper" },
    line: { weight: 400, size: 0.04, color: [0.86, 0.85, 0.82], delay: 0.35, enter: "fade", enterTime: 1.2, leave: "paper" } },
};
const crumbles = d => d.leave === "dust" || d.leave === "paper";
const leaveTimeOf = d => crumbles(d) ? P.leaveTime : d.leaveTime;
const cubicOut = p => 1 - (1 - p) ** 3;
const backOut = p => { const c = 1.70158, q = p - 1; return 1 + (c + 1) * q * q * q + c * q * q; };
// How a text comes in at its share in of its enter (secs: seconds since it began): its alpha a, scale s (sx, sy on top),
// move x in pixels and y in its lines.
function enterState(kind, i, secs, line) {
  const st = { a: 1, s: 1, sx: 1, sy: 1, x: 0, y: 0 };
  switch (kind) {
    case "fade": st.a = smooth(i); break;
    case "pop": st.a = Math.min(1, i * 2); st.s = 0.5 + 0.5 * backOut(i); break;
    case "slam": st.a = Math.min(1, i * 3); st.s = 1 + 1.5 * (1 - i * i); break;
    case "settle": st.a = smooth(i); st.y = -0.3 * (1 - cubicOut(i)); break;
    case "rise": st.a = cubicOut(i); st.y = 0.75 * (1 - cubicOut(i)); break;
    case "drop": st.a = cubicOut(i); st.y = -0.75 * (1 - cubicOut(i)); break;
    case "slideup": st.a = cubicOut(i); st.y = 0.4 * (1 - cubicOut(i)); break;
    case "impact": {
      // falls onto the screen, faster and faster, and hits: a squash that rings out, a shake
      if (secs < IMPACT) { const u = secs / IMPACT; st.s = 1.45 - 0.45 * u * u; st.a = Math.min(1, u * 2.5); break; }
      const k = secs - IMPACT, ring = Math.exp(-k * 18);
      st.sy = 1 - 0.07 * ring * Math.cos(k * 40); st.sx = 1 + 0.04 * ring * Math.cos(k * 40);
      const shake = Math.exp(-k * 14);
      st.x = 0.03 * line * shake * Math.sin(k * 70); st.y = 0.02 * shake * Math.cos(k * 55);
      break;
    }
  }
  return st;
}
function leaveState(kind, o, st) {
  switch (kind) {
    case "fade": st.a *= 1 - smooth(o); break;
    case "rise": st.a *= 1 - o; st.y -= 0.5 * o; break;
    case "sink": st.a *= 1 - o; st.y += 0.5 * o; break;
    case "grow": st.a *= 1 - o; st.s *= 1 + 0.3 * o; break;
    case "shrink": st.a *= 1 - o; st.s *= 1 - 0.5 * o; break;
    case "lift": st.a *= 1 - smooth(o); st.y -= 0.25 * cubicOut(o); st.s *= 1 + 0.05 * o; break;
    case "trackout": st.a *= 1 - smooth(o); break;   // its letters are drawn by drawTrackout
    case "erode": st.a *= 1 - smooth(o); break;      // drawn by drawErode
  }
  return st;
}
const IMPACT = 0.16;

// ---------------------------------------------------------------- Dust.java's arithmetic
const M64 = (1n << 64n) - 1n;
function unit(seed, index, salt) {
  let z = (seed + 0x9E3779B97F4A7C15n * BigInt(index + 1) + 0xD1B54A32D192ED03n * BigInt(salt + 1)) & M64;
  z = ((z ^ (z >> 30n)) * 0xBF58476D1CE4E5B9n) & M64;
  z = ((z ^ (z >> 27n)) * 0x94D049BB133111EBn) & M64;
  z ^= z >> 31n;
  return Number(z >> 11n) * 2 ** -53;
}
const smooth = p => p * p * (3 - 2 * p);
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const point = (x, y, seed) => unit(seed, (Math.imul(x, 7919) + Math.imul(y, 104729)) | 0, 11);
function noise(x, y, seed) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = smooth(x - ix), fy = smooth(y - iy);
  const a = point(ix, iy, seed), b = point(ix + 1, iy, seed), c = point(ix, iy + 1, seed), d = point(ix + 1, iy + 1, seed);
  const top = a + (b - a) * fx, bottom = c + (d - c) * fx;
  return top + (bottom - top) * fy;
}
const grain = (col, row, seed) => 0.7 * noise(col / PATCH, row / PATCH, seed) + 0.3 * noise(col / FINE_PATCH, row / FINE_PATCH, seed ^ 0x2545F491n);
const start = (along, g, seed, index) => P.SWEEP * clamp(along, 0, 1) + P.JITTER * (0.75 * clamp(g, 0, 1) + 0.25 * unit(seed, index, 1));
const life = (seed, index) => (1 - P.SWEEP - P.JITTER) * (0.75 + 0.25 * unit(seed, index, 2));
const worn = (progress, st) => smooth(clamp((progress - st + P.WEATHER) / P.WEATHER, 0, 1));
const alphaAt = age => age <= 0 ? 1 : age >= 1 ? 0 : 1 - smooth(clamp((age - P.HOLD) / (1 - P.HOLD), 0, 1));
const sizeAt = age => 1 - 0.55 * clamp(age, 0, 1);
const caught = age => clamp((age - CATCH) / (1 - CATCH), 0, 1);
const ease = age => { const a = clamp(age, 0, 1); return a * (0.25 + 0.75 * a); };
const ember = age => age <= 0 || age >= 1 / 3 ? 0 : age < 0.08 ? age / 0.08 : 1 - (age - 0.08) / (1 / 3 - 0.08);
const ash = age => 1 - (1 - ASH) * smooth(clamp(age / 0.7, 0, 1));
function wobble(turns) { const f = turns - Math.floor(turns); const t = f < 0.25 ? 4 * f : f < 0.75 ? 2 - 4 * f : 4 * f - 4; return t * (1.5 - 0.5 * t * t); }
function driftX(age, side, freq, phase) { const a = clamp(age, 0, 1), w = caught(a); return SIDE * side * ease(w) + SWIRL_X * w * wobble(freq * a + phase); }
function driftY(age, rise, freq, phase) { const a = clamp(age, 0, 1), w = caught(a); return SAG * smooth(clamp(a / CATCH, 0, 1)) - RISE * rise * ease(w) + SWIRL_Y * w * wobble(0.8 * freq * a + phase); }
function wave(across, seed) { const x = clamp(across, 0, 1) * 3, at = Math.floor(x); const from = unit(seed, at, 7), to = unit(seed, at + 1, 7); return from + (to - from) * smooth(x - at); }
const heat = age => age <= 0 ? 1 : age >= P.COOL ? 0 : 1 - smooth(age / P.COOL);
function burning(wear, burn, flicker, into) {
  const glow = 1 - P.FLICKER_DEPTH * flicker, S = [P.SCORCH_R, P.SCORCH_G, P.SCORCH_B], C = [P.CHAR_R, P.CHAR_G, P.CHAR_B];
  let from, to, s, hot;
  if (wear < P.SCORCH_END) { s = wear / P.SCORCH_END; hot = 0; from = [1, 1, 1]; to = S; }
  else if (wear < P.GLOW_PEAK) { s = smooth((wear - P.SCORCH_END) / (P.GLOW_PEAK - P.SCORCH_END)); hot = s * glow; from = S; to = burn.map(v => v * glow); }
  else if (wear < P.GLOW_END) { s = smooth((wear - P.GLOW_PEAK) / (P.GLOW_END - P.GLOW_PEAK)); hot = (1 - s) * glow; from = burn.map(v => v * glow); to = C; }
  else { s = 1; hot = 0; from = C; to = C; }
  for (let i = 0; i < 3; i++) into[i] = from[i] + (to[i] - from[i]) * s;
  return hot;
}

const SWEEPS = ["right", "left", "up", "down", "upright", "upleft", "downright", "downleft"];
const fromLeft = s => s === "right" || s === "upright" || s === "downright";
const diagonal = s => SWEEPS.indexOf(s) >= 4;
const fromTop = s => s === "downright" || s === "downleft";

function cut(alpha, width, height, size, sweep, seed) {
  let ink, columns, rows, count = 0;
  for (let attempt = 0; attempt < 12; attempt++) {
    columns = Math.ceil(width / size); rows = Math.ceil(height / size);
    ink = new Uint8Array(columns * rows); count = 0;
    const across = new Int32Array(width);
    for (let x = 0; x < width; x++) across[x] = Math.min(columns - 1, Math.floor(x / size));
    for (let y = 0; y < height; y++) {
      const base = Math.min(rows - 1, Math.floor(y / size)) * columns;
      for (let x = 0; x < width; x++) { const at = base + across[x]; if (!ink[at] && alpha[(y * width + x) * 4 + 3] >= INK) { ink[at] = 1; count++; } }
    }
    if (count <= MAX_CELLS) break;
    size *= Math.sqrt(count / MAX_CELLS) * 1.02;
  }
  if (count === 0 || count > MAX_CELLS) return null;
  const byRows = sweep === "right" || sweep === "left" || diagonal(sweep);
  const lanes = byRows ? rows : columns, steps = byRows ? columns : rows;
  const c = { size, columns, rows, lanes, count, sweep, column: new Int32Array(count), row: new Int32Array(count),
    start: new Float32Array(count), life: new Float32Array(count), side: new Float32Array(count), rise: new Float32Array(count),
    freq: new Float32Array(count), phase: new Float32Array(count), phase2: new Float32Array(count), flake: new Float32Array(count),
    laneFrom: new Int32Array(lanes + 1), suffix: new Float32Array(count) };
  let at = 0;
  for (let lane = 0; lane < lanes; lane++) {
    c.laneFrom[lane] = at;
    for (let step = 0; step < steps; step++) {
      let column, row;
      if (byRows) { row = lane; column = fromLeft(sweep) ? step : columns - 1 - step; }
      else { column = lane; row = sweep === "down" ? step : rows - 1 - step; }
      const index = row * columns + column;
      if (!ink[index]) continue;
      c.column[at] = column; c.row[at] = row;
      const along = diagonal(sweep) ? (step + 0.5 + (fromTop(sweep) ? row + 0.5 : rows - row - 0.5)) / (columns + rows) : (step + 0.5) / steps;
      c.start[at] = start(along, grain(column, row, seed), seed, index);
      c.life[at] = life(seed, index);
      const way = unit(seed, index, 3);
      const gust = 0.7 + 0.3 * wave((lane + 0.5) / lanes, seed ^ 0x5BD1E995n);
      const windward = diagonal(sweep) ? (fromLeft(sweep) ? -1 : 1) : sweep === "right" ? 1 : -1;
      c.side[at] = byRows ? windward * (0.5 * gust + 0.5 * (0.45 + 0.55 * way)) : (2 * way - 1) * 0.6;
      c.rise[at] = 0.5 + 1.0 * unit(seed, index, 4);
      const kind = unit(seed, index, 10);
      c.flake[at] = kind < 0.6 ? 0.8 + 0.2 * kind / 0.6 : 0.4 + 0.2 * (kind - 0.6) / 0.4;
      c.freq[at] = 0.5 + 0.6 * unit(seed, index, 5);
      c.phase[at] = unit(seed, index, 6);
      c.phase2[at] = unit(seed, index, 8);
      at++;
    }
    let earliest = Infinity;
    for (let cell = at - 1; cell >= c.laneFrom[lane]; cell--) earliest = c.suffix[cell] = Math.min(earliest, c.start[cell]);
  }
  c.laneFrom[lanes] = at;
  c.unreached = (lane, progress) => {
    let low = c.laneFrom[lane], high = c.laneFrom[lane + 1];
    while (low < high) { const mid = (low + high) >>> 1; if (c.suffix[mid] > progress) high = mid; else low = mid + 1; }
    return low;
  };
  return c;
}

// ---------------------------------------------------------------- WebGL: the game's interface drawing (premultiplied)
const view = document.getElementById("view");
const gl = view.getContext("webgl", { premultipliedAlpha: false, alpha: false, antialias: false });
const VS = `attribute vec2 pos; attribute vec2 uv; attribute vec4 col; attribute vec3 aux; uniform vec2 screen; uniform vec3 camera;
varying vec2 vUv; varying vec4 vCol; varying vec3 vAux;
void main() { vUv = uv; vCol = col; vAux = aux; vec2 p = (pos - camera.xy) * camera.z + screen * 0.5;
  gl_Position = vec4(p.x / screen.x * 2.0 - 1.0, 1.0 - p.y / screen.y * 2.0, 0.0, 1.0); }`;
// mode 0: the picture times the colour (the game's own drawing). mode 1: a text burning as paper, by its burn map.
// mode 2: a flake of ash, an irregular shard.
const FS = `precision highp float;
uniform sampler2D tex; uniform sampler2D burnMap; uniform float mode, progress, edgeW, charW, scorchW, glow, flickerN, flickerD;
uniform vec3 burn, scorched, charred; uniform vec2 picSize; uniform vec2 inner; uniform vec2 blurR; uniform float grainSize, drainBy;
varying vec2 vUv; varying vec4 vCol; varying vec3 vAux;
float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x), mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y); }
void main() {
  if (mode < 0.5) { gl_FragColor = texture2D(tex, vUv) * vCol; return; }
  if (mode < 1.5) {
    vec4 c = texture2D(tex, vUv);
    vec4 bm = texture2D(burnMap, vUv);
    float B = (bm.r * 255.0 * 256.0 + bm.g * 255.0) / 65535.0;
    float x = B - progress;               // how long before this spot burns away
    if (x <= 0.0) discard;
    float a = c.a;

const STORE = "dust-preview-presets";
function ownPresets() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } }
function saveOwn(presets) { try { localStorage.setItem(STORE, JSON.stringify(presets)); return true; } catch { return false; } }
function apply(values) {
  Object.assign(P, values);
  for (const [key, c] of Object.entries(controls)) {
    if (c.kind === "check") c.input.checked = P[key]; else c.input.value = P[key];
    if (c.kind === "range") c.value.textContent = P[key];
  }
  makeBackground(); rebuild(); t = crumbles(STYLES[P.style].title) ? leaveStart() : 0; playing = true;
}
const presetBar = document.createElement("div"); presetBar.className = "bar";
const presetList = document.createElement("select"); presetList.style.flex = "1";
const presetSave = document.createElement("button"); presetSave.textContent = "현재 상태 저장";
const presetDelete = document.createElement("button"); presetDelete.textContent = "삭제";
function fillPresets(selected) {
  presetList.innerHTML = "";
  const add = (name, label) => { const o = document.createElement("option"); o.value = name; o.textContent = label; presetList.appendChild(o); };
  for (const name of Object.keys(BUILT_IN)) add("b:" + name, name);
  for (const name of Object.keys(ownPresets())) add("o:" + name, name + " (저장함)");
  if (selected) presetList.value = selected;
}
presetList.addEventListener("change", () => {
  const v = presetList.value, name = v.slice(2);
  apply(v.startsWith("b:") ? BUILT_IN[name] : ownPresets()[name]);
});
presetSave.addEventListener("click", () => {
  let name = null;
  try { name = prompt("프리셋 이름", "프리셋 " + (Object.keys(ownPresets()).length + 1)); } catch { }
  name = name || "프리셋 " + (Object.keys(ownPresets()).length + 1);
  const own = ownPresets(); own[name] = effectOf(P);
  if (saveOwn(own)) { fillPresets("o:" + name); return; }
  // This window keeps nothing (a page opened from a file in some viewers): the values go below, to be put into the file.
  copyBox.value = "이 창에서는 저장이 막혀 있습니다. 이 값을 파일의 BUILT_IN에 넣으면 프리셋이 됩니다.\n" + JSON.stringify({ [name]: effectOf(P) });
});
presetDelete.addEventListener("click", () => {
  const v = presetList.value; if (!v.startsWith("o:")) return;
  const own = ownPresets(); delete own[v.slice(2)]; saveOwn(own); fillPresets();
});
presetBar.append(presetList, presetSave, presetDelete);
const presetHead = document.createElement("h2"); presetHead.textContent = "프리셋";
side.prepend(presetHead, presetBar);
fillPresets();

document.getElementById("play").addEventListener("click", () => { t = 0; playing = true; });
document.getElementById("leaveNow").addEventListener("click", () => { t = leaveStart(); playing = true; });
document.getElementById("pause").addEventListener("click", e => { playing = !playing; e.target.textContent = playing ? "일시정지" : "계속"; });
const scrub = document.getElementById("scrub");
scrub.addEventListener("input", () => { scrubbing = true; t = scrub.value / 1000 * timeline(); });
scrub.addEventListener("change", () => { scrubbing = false; playing = false; document.getElementById("pause").textContent = "계속"; });

makeBand();
makeBackground();
document.fonts.load('400 40px "Noto Sans KR"').finally(() => { rebuild(); requestAnimationFrame(frame); });
</script>
</body>
</html>
