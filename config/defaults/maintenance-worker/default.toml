# Technical records for backup cleanup. The app's retention setting limits only
# automatic backups. Manual/unknown backups are excluded from automatic-count
# trimming, but explicit deletion and the existing orphan-save policy still apply.
# Set the automatic backup count in the app. Cleanup removes data no retained
# backup uses and rewrites data files that are mostly unused (see below).

[telemetry]
# Keep records of cleanup work and failures. Turning this off removes details
# that may be needed to investigate a cleanup problem; cleanup still runs.
enabled = true
# Keep records for this many cleanup runs. 0 means no run-count limit and may
# allow the diagnostics database to grow indefinitely.
retain_runs = 100
# Approximate limit for these records, in MiB (1 MiB = 1,048,576 bytes).
# Old records are removed when exceeded; the database file may remain larger.
# This does not limit backup size. 0 means no size limit.
max_database_mib = 64


[maintenance]
# Reclaim at most this many deleted revisions per source per pass (1-1000).
# A full batch starts immediately; smaller batches become eligible after the
# delay below. This does NOT choose which backups are deleted.
revision_batch_size = 20
# Smaller pending batches are eligible after this many minutes (0-10080).
# 0 makes any pending deletion eligible at the next available maintenance pass.
# The periodic maintenance worker also services inactive saves; the app must run.
revision_compaction_max_delay_minutes = 60
# When another operation owns the repository writer, wait this many milliseconds before trying
# again (50-5000). Smaller values react faster but create more contention.
writer_retry_delay_ms = 200

# Trim completed, unreferenced repository execution history older than this many
# days (0-3650). 0 disables history trimming. Active/incomplete work is preserved.
history_retention_days = 90
# Also preserve the newest IDs of BOTH run histories, regardless of age.
history_minimum_runs = 1000
# Bound closed-version cleanup and each run-history batch (1-10000).
database_cleanup_batch_size = 1000

# Opportunistic SQLite VACUUM in the maintenance worker, not on each deletion.
# Uses the existing database/WAL transaction mechanism, never a file replacement.
vacuum_enabled = true
# Both free-space thresholds must be met; 1 MiB = 1,048,576 bytes.
vacuum_minimum_free_mib = 4
vacuum_minimum_free_percent = 25
# Larger databases retain reusable space instead of starting an automatic full
# rebuild. Insufficient disk space, active work or lock contention defer VACUUM.
vacuum_maximum_database_mib = 256

# A data file is deleted only when no retained backup needs anything in it. A
# manual or older backup that still needs a few files keeps the whole file, so
# unused space builds up. While the game is closed, cleanup rewrites such files
# into one new file holding only the data still needed. Every copied item is
# checksum-verified and the old files stay until the replacement is committed.
pack_reclamation_enabled = true
# Rewrite a data file when less than this percent of it is still needed (10-90).
# Lower values copy less often but leave more unused space on disk.
pack_reclamation_sparse_percent = 50
# Start only when at least this much space, in MiB, can be recovered in total.
pack_reclamation_minimum_mib = 16
# Copy at most about this much needed data per pass, in MiB (1-4096). Later
# passes continue. Needs free disk space of about twice this amount plus 64 MiB.
pack_reclamation_maximum_copy_mib = 128
