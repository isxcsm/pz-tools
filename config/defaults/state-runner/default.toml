# Technical records for the helper that starts and monitors game-state checks.
# This file does not control backup timing or change a save.
[telemetry]
# Keep records of starts, results, and failures. Turning this off makes a
# failed state check harder to diagnose; it does not stop the check itself.
enabled = true
# Keep records for this many helper runs. 0 means no run-count limit and may
# allow the diagnostics database to grow indefinitely.
retain_runs = 100
# Approximate limit for these records, in MiB (1 MiB = 1,048,576 bytes).
# Old records are removed when exceeded; the database file may remain larger.
# This does not limit backup size. 0 means no size limit.
max_database_mib = 64
