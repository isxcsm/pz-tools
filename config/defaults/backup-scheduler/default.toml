# Technical records for the helper that checks when an automatic backup is
# due. Change the automatic backup interval in the app, not in this file.

[telemetry]
# Keep records of scheduler activity and failures. Turning this off makes
# missed automatic backups harder to investigate; it does not stop scheduling.
enabled = true
# Keep records for this many checks. 0 means no run-count limit and may allow
# the diagnostics database to grow indefinitely.
retain_runs = 100
# Approximate limit for these records, in MiB (1 MiB = 1,048,576 bytes).
# Old records are removed when exceeded; the database file may remain larger.
# This does not limit backup size. 0 means no size limit.
max_database_mib = 64


[scheduler]
# Check whether a backup is due every this many milliseconds (100-5000). This is NOT the
# automatic backup interval, which is set in the app. Larger values can delay the start of a due
# backup.
wake_interval_ms = 1000
# Start the worker/connection ahead of the due time (5-30 seconds).
# The in-game countdown still occupies only the final five seconds; capture waits until due.
preparation_lead_seconds = 8
