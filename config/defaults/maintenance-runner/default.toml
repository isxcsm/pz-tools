# Technical records for the helper that starts and monitors backup cleanup.
# Change how many backup revisions to keep in the app, not in this file.
[telemetry]
# Keep records of cleanup starts, results, and failures. Turning this off
# makes cleanup failures harder to diagnose; it does not stop cleanup.
enabled = true
# Keep records for this many helper runs. 0 means no run-count limit and may
# allow the diagnostics database to grow indefinitely.
retain_runs = 100
# Approximate limit for these records, in MiB (1 MiB = 1,048,576 bytes).
# Old records are removed when exceeded; the database file may remain larger.
# This does not limit backup size. 0 means no size limit.
max_database_mib = 64
