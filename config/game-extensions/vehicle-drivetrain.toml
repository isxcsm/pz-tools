# Experimental normalized game-force profile. Native force/time calibration and driving E2E remain pending.
# Optional overrides: <runtimeRoot>/extensions/vehicle-drivetrain.toml (same flat keys).
schema_version = 1
# The app's feature preferences (including unwritten UI defaults) override these transport defaults.
torque_enabled = true            # Forward acceleration and transmission; independent of reverse/steering
reverse_enabled = true           # Smooth reverse launch and direction transitions
steering_enabled = true          # Keyboard steering by the time a key is really held; gamepads retain original behavior
area_light_enabled = true        # Light the ground around the vehicle you are in while its headlights are lit
force_scale = 1.0                 # 0.25..1.5; not an SI horsepower conversion
forward_torque_boost_fraction = 0.10 # 0..0.10; RPM-curve boost above the base forward force (0 disables only this boost)
low_gear_boost = 1.0              # 1.0..1.6; default adds no extra first-gear boost
reverse_force_ratio = 1.0         # 0.4..1.0; multiplier of the vehicle's vanilla reverse output
reverse_max_speed_kph = 0.0       # 0 = vanilla Script.maxSpeedReverse / 1.5; explicit override: 4..35 km/h
reverse_ramp_seconds = 0.8        # 0.3..2.0; throttle AND delivered-force rise
forward_ramp_seconds = 0.3        # 0.1..2.0
direction_hold_seconds = 0.15     # 0.05..0.75; near-stop dwell before direction change
max_dt_seconds = 0.1              # 0.02..0.25; larger gaps yield to the original controller
shift_hold_seconds = 0.35         # 0.1..2.0
upshift_rpm_fraction = 0.82       # 0.65..0.95; must exceed downshift by at least 0.15
downshift_rpm_fraction = 0.32     # 0.15..0.55
# Candidate profiles, not measured physical gearboxes. Unknown engine types stay unsupported.
gear_ratio_span = 3.6            # 2.5..5.0; first/top ratio, geometrically spaced over 3..5 gears
idle_rpm = 800.0                 # 500..1200; must be below launch_rpm
launch_rpm = 1500.0              # 1000..2500; below all redlines and the minimum post-upshift RPM
generic_redline_rpm = 5500.0      # 3000..6500; generic engine family
utility_redline_rpm = 4500.0      # 3000..6500; van/jeep families
sport_redline_rpm = 6500.0        # 3000..6500; firebird family
generic_torque_peak_fraction = 0.50 # 0.25..0.80 of redline
utility_torque_peak_fraction = 0.40 # 0.25..0.80 of redline
sport_torque_peak_fraction = 0.65   # 0.25..0.80 of redline
idle_torque_fraction = 0.60      # 0.30..0.80; bounded low-RPM curve baseline, not physical Nm
rpm_response_seconds = 0.12     # 0.04..0.50; exponential RPM response time constant
direction_speed_mps = 0.15      # 0.05..0.30; opposite-motion threshold for direction hold
forward_governor_start_fraction = 1.0 # 0.75..1.0; default does not reduce propulsion before the nominal limit
reverse_governor_start_fraction = 1.0 # 0.50..1.0; 1 adds no fade before the limit; <1 retains developer soft fade
shift_hysteresis_fraction = 0.08 # 0.04..0.15; lower-gear RPM separation from its upshift threshold
demand_downshift_fraction = 0.48 # 0.25..0.60; kick-down request RPM threshold with >80% demand
# Cross-check: min(redlines) * upshift_rpm_fraction / sqrt(gear_ratio_span) >= launch_rpm.
# Low-mode over-rev protection and final torque fade remain bounded algorithm guards, not bypass options.
# Keyboard steering keeps the game's own response curve, speed scaling and angle limits.
steering_precise_input = true    # Time the steering keys about every millisecond instead of once per frame; false = the game's per-frame timing
# The light around the vehicle. It is placed the way the game places a lightbar's glow and is never saved.
area_light_radius = 8            # 3..20 tiles; whole numbers
area_light_brightness = 0.6      # 0.1..1.0
# Developer-only controls. Not exposed by the user-facing switches.
low_mode = false
probe_only = false               # Observe without committing force/RPM/gear changes
diagnostics_enabled = false      # Bounded latest sample and one-second aggregate driving diagnostics
