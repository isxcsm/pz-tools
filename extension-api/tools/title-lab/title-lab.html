<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #15171a; --panel: #1e2125; --line: #33373d; --text: #d9dde2; --dim: #8a9099; --accent: #e0a050; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 "Noto Sans KR", "Malgun Gothic", sans-serif; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding: 12px; height: 100vh; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; height: auto; } }
  .stage { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  canvas#view { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); border-radius: 6px; display: block; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar input[type=range] { flex: 1; min-width: 160px; }
  button { background: #2a2e34; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #4a3520; border-color: #8a5a2a; }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-y: auto; }
  h2 { font-size: 12px; margin: 14px 0 6px; color: var(--accent); font-weight: 700; letter-spacing: 0.02em; }
  h2:first-child { margin-top: 0; }
  label.row { display: grid; grid-template-columns: 112px 1fr 52px; gap: 6px; align-items: center; margin: 3px 0; }
  label.row span.v { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
  input[type=text], select { width: 100%; background: #121417; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
  .hint { color: var(--dim); font-size: 12px; }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 120px; }
  textarea { width: 100%; height: 120px; background: #121417; color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: 11px/1.4 Consolas, monospace; }
</style>
</head>

<div class="wrap">
  <div class="stage">
    <canvas id="view" width="1280" height="720"></canvas>

      <button class="primary" id="play">처음부터 재생</button>

const cubicOut = p => 1 - (1 - p) ** 3;
const backOut = p => { const c = 1.70158, q = p - 1; return 1 + (c + 1) * q * q * q + c * q * q; };
// How a text comes in at its share in of its enter (secs: seconds since it began): its alpha a, scale s (sx, sy on top),
// move x in pixels and y in its lines. hit: an impact's strength (1: a title's; a line under it LINE_HIT).
function enterState(kind, i, secs, line, hit = 1) {
  const st = { a: 1, s: 1, sx: 1, sy: 1, x: 0, y: 0 };
  switch (kind) {
    case "fade": st.a = smooth(i); break;
    case "pop": st.a = Math.min(1, i * 2); st.s = 0.5 + 0.5 * backOut(i); break;
    case "slam": st.a = Math.min(1, i * 3); st.s = 1 + 1.5 * (1 - i * i); break;
    case "typed": st.a = 1; break;                   // its letters struck one by one by drawType
    case "ink": st.a = 1; break;                     // written stroke by stroke by drawSim
    case "settle": st.a = smooth(i); st.y = -0.3 * (1 - cubicOut(i)); break;
    case "rise": st.a = cubicOut(i); st.y = 0.75 * (1 - cubicOut(i)); break;
    case "drop": st.a = cubicOut(i); st.y = -0.75 * (1 - cubicOut(i)); break;
    case "slideup": st.a = cubicOut(i); st.y = 0.4 * (1 - cubicOut(i)); break;
    case "impact": {
      // falls onto the screen, faster and faster, and hits: a squash that rings out, a shake
      if (secs < IMPACT) { const u = secs / IMPACT; st.s = 1 + 0.45 * hit * (1 - u * u); st.a = Math.min(1, u * 2.5); break; }
      const k = secs - IMPACT, ring = hit * Math.exp(-k * 18);

// Tracking out: the letters drift apart from the middle, softening as if out of focus, rising a little, the outer ones
// a moment ahead.
function drawTrackout(p, st, o) {

    const k = clamp((o - P.TRACK_STAGGER * (1 - Math.abs(d))) / (1 - P.TRACK_STAGGER), 0, 1);
    const a = 1 - smooth(k);

    const u0 = g.x0 / p.w, u1 = g.x1 / p.w;

    const r = p.line * 0.035 * P.TRACK_BLUR * smooth(k);

    gl.uniform2f(U("blurR"), r / p.w, r / p.h);

}

// The impact's light and dust over the title (secs since it began, la: how much of it is left as it leaves).
function drawImpact(p, st, secs, la) {
  if (secs < IMPACT) return;

  const box = (dx, dy, r, g, b) => { const hw = p.w * sx / 2, hh = p.h * sy / 2; quad(cx + dx - hw, cy + dy - hh, cx + dx + hw, cy + dy + hh, 0, 0, 1, 1, r, g, b, 0); };

    quad(cx - wide / 2, y - high / 2, cx + wide / 2, y + high / 2, 0, 0, 1, 1, streak, 0.9 * streak, 0.75 * streak, 0);
    quad(cx - wide * 0.35, y - high * 0.18, cx + wide * 0.35, y + high * 0.18, 0, 0, 1, 1, streak, streak, streak, 0);
    flush(bandTex);

    shard(x, y, hs, 0, 1, 0.8 * fade, 0.78 * fade, 0.74 * fade, fade, 0);

  // once, slowly, over the whole time it stays: from settled to leaving
  const at = (secs - P.SHINE_AT) / Math.max(0.5, p.leaveAt - p.delay - P.SHINE_AT - 0.3);

    flush(p.tex);
  }
  mode = 0;
}

const tint = [0, 0, 0];
function drawDust(p, progress, fade) {
  const c = p.cells; if (!c) return;
  const burn = P.burnOn ? [P.burnR, P.burnG, P.burnB] : null;
  const size = c.size, W = p.w, H = p.h, reach = p.line * P.dustDrift;

    const hx = (right - left) * scale / 2, hy = (bottom - top) * scale / 2;
    const x = p.x + (left + right) / 2 + dx, y = p.y + (top + bottom) / 2 + dy;
    quad(x - hx, y - hy, x + hx, y + hy, left / W, top / H, right / W, bottom / H, r, g, b, a);
  };
  for (let lane = 0; lane < c.lanes; lane++) {
    const from = c.laneFrom[lane], unreached = c.unreached(lane, progress + P.WEATHER);
    if (unreached < c.laneFrom[lane + 1]) {
      const column = c.column[unreached], row = c.row[unreached];
      let left, top, right, bottom;
      switch (c.sweep) {
        case "right": case "upright": case "downright": left = column * size; right = W; top = row * size; bottom = Math.min(H, top + size); break;
        case "left": case "upleft": case "downleft": left = 0; right = Math.min(W, (column + 1) * size); top = row * size; bottom = Math.min(H, top + size); break;
        case "down": top = row * size; bottom = H; left = column * size; right = Math.min(W, left + size); break;
        default: top = 0; bottom = Math.min(H, (row + 1) * size); left = column * size; right = Math.min(W, left + size);
      }
      part(left, top, right, bottom, 0, 0, 1, fade, fade, fade, fade);
    }
    for (let cell = from; cell < unreached; cell++) {
      const left = c.column[cell] * size, top = c.row[cell] * size, right = Math.min(W, left + size), bottom = Math.min(H, top + size);
      const age = (progress - c.start[cell]) / c.life[cell];
      if (age <= 0) {
        const wear = worn(progress, c.start[cell]);
        if (burn) {
          const flicker = 0.5 + 0.5 * Math.sin(2 * Math.PI * (progress * P.FLICKER + c.phase[cell]));
          const hot = burning(wear, burn, flicker, tint);
          const thin = wear > P.GLOW_END ? P.THIN * (wear - P.GLOW_END) / (1 - P.GLOW_END) : 0;
          part(left, top, right, bottom, 0, 0, 1 - thin, fade * tint[0], fade * tint[1], fade * tint[2], fade * (1 - P.GLOW * hot));
          continue;
        }
        const kept = fade * (1 - P.WEATHERED * wear);
        part(left, top, right, bottom, 0, 0, 1 - P.THIN * wear, kept, kept, kept, fade);
        continue;
      }
      if (age >= 1) continue;
      const shown = alphaAt(age) * fade;
      if (shown <= 0.002) continue;
      const dx = reach * driftX(age, c.side[cell], c.freq[cell], c.phase[cell]);
      const dy = reach * driftY(age, c.rise[cell], c.freq[cell], c.phase2[cell]);
      const scale = (1 - P.THIN) * c.flake[cell] * sizeAt(age);
      if (burn && c.phase2[cell] >= P.SPARKS) {
        const grey = shown * (P.CHAR_R + (P.CHAR_ASH - P.CHAR_R) * smooth(clamp(age / 0.7, 0, 1)));
        part(left, top, right, bottom, dx, dy, scale, grey, grey, grey, shown);
        continue;
      }
      if (burn) {
        const hot = heat(age), keep = P.BURN_ASH + (1 - P.BURN_ASH) * hot;
        part(left, top, right, bottom, dx, dy, scale, shown * burn[0] * keep, shown * burn[1] * keep, shown * burn[2] * keep, shown * (1 - P.GLOW * hot));
        continue;
      }

      const red = shown * grey;
      part(left, top, right, bottom, dx, dy, scale, red, red * (1 - (1 - EMBER_G) * warm), red * (1 - (1 - EMBER_B) * warm), shown);
    }

}

// ---------------------------------------------------------------- the clock
let t = 0, playing = true, last = performance.now(), scrubbing = false;
const leaveStart = () => pieces[0] ? pieces[0].leaveAt : 0;
// (drawn only when the time or anything on the page changed: a still frame costs nothing)
let drawnAt = -1, dirty = true;
for (const kind of ["input", "change", "click", "pointerdown", "keydown"]) document.addEventListener(kind, () => { dirty = true; }, true);
window.addEventListener("resize", () => { dirty = true; });
function frame(now) {
  const dt = (now - last) / 1000; last = now;
  const end = timeline();
  if (playing && !scrubbing) { t += dt * Number(document.getElementById("speed").value); if (t > end) t = end; }
  if (!dirty && t === drawnAt) { requestAnimationFrame(frame); return; }
  drawnAt = t; dirty = false;
  gl.viewport(0, 0, view.width, view.height);
  gl.uniform2f(loc.screen, view.width, view.height);
  gl.disable(gl.BLEND);
  gl.uniform3f(U("camera"), view.width / 2, view.height / 2, 1);
  mode = 0;
  quad(0, 0, view.width, view.height, 0, 0, 1, 1, 1, 1, 1, 1); flush(bgTex);
  const S = STYLES[P.style];
  gl.uniform3f(U("camera"), view.width / 2, P.zoom > 1 ? S.y * view.height + S.title.size * view.height * 0.6 : view.height / 2, P.zoom);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

  const states = pieces.map(p => {
    const d = p.spec, secs = t - p.delay, leave = p.leaveAt - p.delay;
    if (secs < 0) return null;
    const out = secs >= leave ? (secs - leave) / leaveTimeOf(d) : 0;
    if (out >= 1) return null;
    const inn = d.enterTime > 0 ? Math.min(1, Math.min(secs, leave) / d.enterTime) : 1;
    const st = enterState(d.enter, inn, Math.min(secs, leave), p.line, hitOf(p));
    st.secs = secs; st.out = out; st.left = 1;
    if (!crumbles(d)) { const before = st.a; leaveState(d.leave, out, st, leaveTimeOf(d)); st.left = before > 0 ? st.a / before : 0; }
    return st;
  });
  // the backdrop: over the title and its line, as strong as the title is seen (a crumbling one takes it with it)
  const first = states[0];
  if (P.backdrop && first) {
    // (it fades in as dust's title does, over BACKDROP_IN, whatever the title's own enter)
    const tp = pieces[0], fadeIn = smooth(clamp(first.secs / BACKDROP_IN, 0, 1));
    const seen = Math.min(fadeIn, crumbles(tp.spec) ? first.a * (1 - smooth(first.out))
      : tp.spec.leave === "wash" ? 1 - smooth(clamp((first.out - 0.5) / 0.5, 0, 1)) : first.a);
    const low = tp.cx - Math.max(...pieces.map(p => p.ink)) / 2, high = tp.cx + Math.max(...pieces.map(p => p.ink)) / 2;
    const top = tp.cy - tp.line / 2, lastP = pieces[pieces.length - 1], bottom = lastP.cy + lastP.line / 2;
    const side = 2.6 * tp.line, endH = 1.0 * tp.line;
    gl.uniform2f(U("inner"), (high - low) / (high - low + 2 * side), (bottom - top) / (bottom - top + 2 * endH));
    mode = 6;
    shard((low + high) / 2, (top + bottom) / 2, (high - low) / 2 + side, 0, (bottom - top + 2 * endH) / (high - low + 2 * side), 0, 0, 0, S.backdrop * seen, 0);
    flush(bandTex);
    mode = 0;
  }
  pieces.forEach((p, i) => { if (states[i] && p.spec.fog) drawFog(p, states[i], true); });
  pieces.forEach((p, i) => {
    const st = states[i];
    if (!st) return;
    if (crumbles(p.spec) && st.out > 0) {
      if (p.spec.leave === "paper") drawPaper(p, st.out, 1); else { drawDust(p, st.out, 1); flush(p.tex); }
      return;
    }
    const cx = p.cx + st.x, cy = p.cy + st.y * p.line * st.s, hw = p.w * st.s * st.sx / 2, hh = p.h * st.s * st.sy / 2;
    if (p.spec.lit) drawTorch(p, st);
    else if (p.spec.radio) drawSignal(p, st);
    else if (p.spec.fog) drawFog(p, st, false);
    else if (p.spec.bleed) drawBleed(p, st);
    else if (p.spec.sink) drawSink(p, st);
    else if (p.spec.typed) drawType(p, st);
    else if (p.spec.pulse) drawPulse(p, st);
    else if (p.spec.inked) drawInked(p, st);
    else if (p.spec.sim) drawSim(p, st);
    else if (p.spec.leave === "trackout" && st.out > 0) drawTrackout(p, st, st.out);
    else if (p.spec.leave === "erode" && st.out > 0) drawErode(p, st, st.out);
    else if (st.a > 0.002) { quad(cx - hw, cy - hh, cx + hw, cy + hh, 0, 0, 1, 1, st.a, st.a, st.a, st.a); flush(p.tex); }
    if (p.spec.enter === "impact") drawImpact(p, st, st.secs, st.left);
  });
  const out = clamp((t - leaveStart()) / leaveTimeOf(pieces[0].spec), 0, 1);
  document.getElementById("time").textContent = `${t.toFixed(2)}s / ${end.toFixed(1)}s · 사라짐 ${(out * 100).toFixed(0)}%`;
  if (!scrubbing) document.getElementById("scrub").value = Math.round(t / end * 1000);
  requestAnimationFrame(frame);
}

const copyBox = document.createElement("textarea"); copyBox.readOnly = true; side.appendChild(copyBox);
const copy = document.createElement("button"); copy.textContent = "Java 상수 만들기"; side.appendChild(copy);
const reset = document.createElement("button"); reset.textContent = "기본값으로"; reset.style.marginLeft = "6px"; side.appendChild(reset);
const DEFAULTS = { ...P };
copy.addEventListener("click", () => {
  const f = v => String(v);
  copyBox.value =
`static final double GLOW = ${f(P.GLOW)}, COOL = ${f(P.COOL)}, BURN_ASH = ${f(P.BURN_ASH)}, SCORCH_END = ${f(P.SCORCH_END)}, GLOW_PEAK = ${f(P.GLOW_PEAK)}, GLOW_END = ${f(P.GLOW_END)},
    SPARKS = ${f(P.SPARKS)}, CHAR_ASH = ${f(P.CHAR_ASH)};
static final double[] SCORCHED = { ${f(P.SCORCH_R)}, ${f(P.SCORCH_G)}, ${f(P.SCORCH_B)} }, CHARRED = { ${f(P.CHAR_R)}, ${f(P.CHAR_G)}, ${f(P.CHAR_B)} };
static final double FLICKER = ${f(P.FLICKER)}, FLICKER_DEPTH = ${f(P.FLICKER_DEPTH)};
static final double SWEEP = ${f(P.SWEEP)}, JITTER = ${f(P.JITTER)};  WEATHER = ${f(P.WEATHER)}, WEATHERED = ${f(P.WEATHERED)}, THIN = ${f(P.THIN)}
-- OA Titles.BURN = { ${f(P.burnR)}, ${f(P.burnG)}, ${f(P.burnB)} }`;
  copyBox.select();
});
reset.addEventListener("click", () => {
  Object.assign(P, DEFAULTS);
  for (const [key, c] of Object.entries(controls)) {
    if (c.kind === "check") c.input.checked = P[key]; else c.input.value = P[key];
    if (c.kind === "range") c.value.textContent = P[key];
  }
  makeBackground(); rebuild();
});

// ---------------------------------------------------------------- presets: the effect's values (not the text, background or zoom)
const NOT_EFFECT = new Set(["title", "sub", "bg", "zoom"]);
const effectOf = values => Object.fromEntries(Object.entries(values).filter(([k]) => !NOT_EFFECT.has(k)));
const BUILT_IN = {
  "종이 연소 (dust)": effectOf(DEFAULTS),
  "숯불 셀 (leave dust)": { ...effectOf(DEFAULTS), style: "dust", leaveTime: 6, CHAR_ASH: 0.2 },
  "짧은 소식 (brief)": { ...effectOf(DEFAULTS), style: "brief", hold: 3, sweep: "out", leaveTime: 2.4, dustDrift: 0.8, dustSize: 1, ACCEL: 2.5, ASH_LIFE: 0.45 },
  "각인 (stamp)": { ...effectOf(DEFAULTS), style: "stamp-new" },
  "손전등 (discovery)": { ...effectOf(DEFAULTS), style: "discovery-new" },
  "무전 (notice)": { ...effectOf(DEFAULTS), style: "notice-new" },
  "안개 걷힘 (unveil)": { ...effectOf(DEFAULTS), style: "unveil-new" },
  "번짐 (bleed)": { ...effectOf(DEFAULTS), style: "bleed-new" },
  "가라앉음 (sink)": { ...effectOf(DEFAULTS), style: "sink-new" },
  "타자 (type)": { ...effectOf(DEFAULTS), style: "type-new" },
  "고동 (pulse)": { ...effectOf(DEFAULTS), style: "pulse-new" },
  "참고: 먹 (sim)": { ...effectOf(DEFAULTS), style: "sim-sumi", bg: "paper" },
  "참고: 상아 잉크 (sim)": { ...effectOf(DEFAULTS), style: "sim-ivory", bg: "night" },
  "참고: 피 (sim)": { ...effectOf(DEFAULTS), style: "sim-blood", bg: "night" },
  "참고: 액체 금속 (sim)": { ...effectOf(DEFAULTS), style: "sim-chrome", bg: "plum" },
};
const STORE = "title-lab-presets";
function ownPresets() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } }
function saveOwn(presets) { try { localStorage.setItem(STORE, JSON.stringify(presets)); return true; } catch { return false; } }
function apply(values) {
  Object.assign(P, values);
  const sample = STYLES[P.style].sample;
  if (sample) { P.title = sample.title; P.sub = sample.sub; }
  for (const [key, c] of Object.entries(controls)) {
    if (c.kind === "check") c.input.checked = P[key]; else c.input.value = P[key];
    if (c.kind === "range") c.value.textContent = P[key];
  }
  makeBackground(); rebuild(); t = crumbles(STYLES[P.style].title) ? leaveStart() : 0; playing = true;
}
const presetBar = document.createElement("div"); presetBar.className = "bar";
const presetList = document.createElement("select"); presetList.style.flex = "1";
const presetSave = document.createElement("button"); presetSave.textContent = "현재 상태 저장";
const presetDelete = document.createElement("button"); presetDelete.textContent = "삭제";
function fillPresets(selected) {
  presetList.innerHTML = "";
  const add = (name, label) => { const o = document.createElement("option"); o.value = name; o.textContent = label; presetList.appendChild(o); };
  for (const name of Object.keys(BUILT_IN)) add("b:" + name, name);
  for (const name of Object.keys(ownPresets())) add("o:" + name, name + " (저장함)");
  if (selected) presetList.value = selected;
}
presetList.addEventListener("change", () => {
  const v = presetList.value, name = v.slice(2);
  apply(v.startsWith("b:") ? BUILT_IN[name] : ownPresets()[name]);
});
presetSave.addEventListener("click", () => {
  let name = null;
  try { name = prompt("프리셋 이름", "프리셋 " + (Object.keys(ownPresets()).length + 1)); } catch { }
  name = name || "프리셋 " + (Object.keys(ownPresets()).length + 1);
  const own = ownPresets(); own[name] = effectOf(P);
  if (saveOwn(own)) { fillPresets("o:" + name); return; }
  // This window keeps nothing (a page opened from a file in some viewers): the values go below, to be put into the file.
  copyBox.value = "이 창에서는 저장이 막혀 있습니다. 이 값을 파일의 BUILT_IN에 넣으면 프리셋이 됩니다.\n" + JSON.stringify({ [name]: effectOf(P) });
});
presetDelete.addEventListener("click", () => {
  const v = presetList.value; if (!v.startsWith("o:")) return;
  const own = ownPresets(); delete own[v.slice(2)]; saveOwn(own); fillPresets();
});
presetBar.append(presetList, presetSave, presetDelete);
const presetHead = document.createElement("h2"); presetHead.textContent = "프리셋";
side.prepend(presetHead, presetBar);
fillPresets();

document.getElementById("play").addEventListener("click", () => { t = 0; playing = true; });
document.getElementById("leaveNow").addEventListener("click", () => { t = leaveStart(); playing = true; });
document.getElementById("pause").addEventListener("click", e => { playing = !playing; e.target.textContent = playing ? "일시정지" : "계속"; });
const scrub = document.getElementById("scrub");
scrub.addEventListener("input", () => { scrubbing = true; t = scrub.value / 1000 * timeline(); });
scrub.addEventListener("change", () => { scrubbing = false; playing = false; document.getElementById("pause").textContent = "계속"; });

makeBand();
makeBackground();
document.fonts.load('400 40px "Noto Sans KR"').finally(() => { rebuild(); requestAnimationFrame(frame); });
</script>
